# Server
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/reservas_db?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# EMAIL
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

sistema.email.remetente=${MAIL_FROM:${MAIL_USERNAME}}
sistema.email.nome=${MAIL_FROM_NAME:Sistema de Reservas UniFil}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# HTTPS (ver README / SECURITY.md para detalhes de deploy)
security.require-https=${REQUIRE_HTTPS:false}

# Nunca expor detalhes internos de erro ao cliente
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Nao expor versao do servidor/tecnologia nos headers de resposta
server.error.whitelabel.enabled=false
